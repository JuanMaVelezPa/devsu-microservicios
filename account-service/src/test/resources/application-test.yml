spring:
  datasource:
    url: jdbc:h2:mem:account_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS account
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.default_schema: account
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    consumer:
      group-id: account-service-test
      auto-offset-reset: earliest

devsu:
  kafka:
    topic-client-events: devsu.client.events
    consumer-group: account-service-test
