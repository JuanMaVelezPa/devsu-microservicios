server:
  port: 8081

spring:
  application:
    name: client-service
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:devsu_db}?currentSchema=client
    username: ${POSTGRES_USER:devsu}
    password: ${POSTGRES_PASSWORD:devsu_secret}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.default_schema: client

devsu:
  kafka:
    topic-client-events: ${KAFKA_TOPIC_CLIENT_EVENTS:devsu.client.events}
  outbox:
    publish-interval-ms: ${OUTBOX_PUBLISH_INTERVAL_MS:3000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
