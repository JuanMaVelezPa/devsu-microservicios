server:
  port: 8081

spring:
  application:
    name: client-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:devsu_db}?currentSchema=client
    username: ${POSTGRES_USER:devsu}
    password: ${POSTGRES_PASSWORD:devsu_secret}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: client

springdoc:
  swagger-ui:
    path: /swagger-ui.html
